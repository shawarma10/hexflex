[package]
name = "hexflex"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "A CLI hex editor for dumping, inspecting and manipulating bytes"
license = "MIT"
readme = "README.md"
repository = "https://github.com/shawarma10/hexflex"
homepage = "https://github.com/shawarma10/hexflex"
keywords = ["hex", "editor", "hexdump", "binary", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["target/", ".github/"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.53", features = ["derive"] }
owo-colors = "4.3.0"
rustyline = "18.0.0"
